services:
 
  wallabag:
    image: wallabag/wallabag
    container_name: wallabag
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=wallaroot
      - SYMFONY__ENV__DATABASE_DRIVER=pdo_mysql
      - SYMFONY__ENV__DATABASE_HOST=db
      - SYMFONY__ENV__DATABASE_PORT=3306
      - SYMFONY__ENV__DATABASE_NAME=wallabag
      - SYMFONY__ENV__DATABASE_USER=wallabag
      - SYMFONY__ENV__DATABASE_PASSWORD=wallapass
      - SYMFONY__ENV__DATABASE_CHARSET=utf8mb4
      - SYMFONY__ENV__DOMAIN_NAME=http://192.168.1.11:6749
      - SYMFONY__ENV__SERVER_NAME=emmecilab
      - SYMFONY__ENV__FOSUSER_CONFIRMATION=false
      - SYMFONY__ENV__FOSUSER_REGISTRATION=true
      - SYMFONY__ENV__TWOFACTOR_AUTH=true
    ports:
      - 6749:80
    volumes:
      - /volume1/docker/wallabag/images:/var/www/wallabag/web/assets/images:rw
      - /volume1/docker/wallabag/data:/var/www/wallabag/data:rw
    depends_on:
     - db
     - redis
     
  db:
    image: mariadb:11.4-noble
    container_name: wallabag-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=wallaroot
      - TZ=Europe/Rome
    volumes:
      - /volume1/docker/wallabag/db:/var/lib/mysql:rw
      
  redis:
    image: redis:alpine
    container_name: wallabag-redis
    healthcheck:
     test: ["CMD-SHELL", "redis-cli ping || exit 1"]
    volumes:
      - /volume1/docker/wallabag/redis:/data:rw
    restart: always
